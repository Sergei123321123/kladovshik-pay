<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Активация Кладовщик PRO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #1a1a1a);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg-color: var(--tg-theme-secondary-bg-color, #242424);
      --hint-color: var(--tg-theme-hint-color, #9e9e9e);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background-color: var(--secondary-bg-color);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h2 {
      margin-bottom: 18px;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-color);
    }

    #deviceIdInput {
      width: 100%;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 12px;
      font-size: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-color: rgba(0, 0, 0, 0.2);
      color: var(--text-color);
      outline: none;
    }

    #deviceIdInput:focus {
      border-color: var(--button-color);
    }

    #generateKeyBtn {
      width: 100%;
      min-height: 48px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: var(--button-color);
      color: var(--button-text-color);
      transition: opacity 0.2s;
    }

    #generateKeyBtn:active {
      opacity: 0.85;
    }

    #resultBlock {
      margin-top: 16px;
      display: none;
    }

    .error-msg {
      color: #ff5252;
      font-size: 14px;
      padding: 10px;
      background: rgba(255, 82, 82, 0.1);
      border: 1px solid rgba(255, 82, 82, 0.3);
      border-radius: 8px;
    }

    .key-card {
      padding: 16px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .key-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #4caf50;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 14px;
      border-radius: 8px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
      user-select: all;
    }

    .key-hint {
      font-size: 13px;
      color: var(--hint-color);
    }

    .copy-btn {
      width: 100%;
      min-height: 44px;
      border-radius: 8px;
      border: 1px solid var(--button-color);
      background-color: transparent;
      color: var(--button-color);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover, .copy-btn:active {
      background-color: var(--button-color);
      color: var(--button-text-color);
    }
    .tariff-card {
      background: linear-gradient(135deg, rgba(36, 129, 204, 0.22) 0%, rgba(26, 26, 26, 0.7) 100%);
      border: 1px solid rgba(36, 129, 204, 0.5);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 14px;
      text-align: left;
    }

    .tariff-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .tariff-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-color);
    }

    .tariff-badge {
      background: var(--button-color);
      color: var(--button-text-color);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tariff-price {
      font-size: 22px;
      font-weight: 700;
      color: #4caf50;
    }

    .payment-methods {
      text-align: left;
      margin-bottom: 16px;
    }

    .payment-title {
      font-size: 13px;
      color: var(--hint-color);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .payment-option {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .payment-option:hover {
      border-color: rgba(36, 129, 204, 0.6);
      background: rgba(36, 129, 204, 0.08);
    }

    .payment-option input[type="radio"] {
      width: 18px;
      height: 18px;
      min-height: 18px;
      accent-color: var(--button-color);
      cursor: pointer;
      flex-shrink: 0;
    }

    .payment-option-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .payment-method-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-color);
    }

    .payment-method-desc {
      font-size: 12px;
      color: var(--hint-color);
    }

    .sbp-notice {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: rgba(255, 167, 38, 0.1);
      border: 1px solid rgba(255, 167, 38, 0.3);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
    }

    .notice-icon {
      font-size: 16px;
      line-height: 1.2;
    }

    .notice-text {
      font-size: 12px;
      color: #ffb74d;
      line-height: 1.4;
    }
    .back-btn {
      width: 100%;
      min-height: 44px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-color: transparent;
      color: var(--hint-color);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .back-btn:hover, .back-btn:active {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Активация Кладовщик PRO</h2>
    
    <!-- Шаг 1: Оплата и ввод данных -->
    <div id="stepPayment">
      <input type="text" id="deviceIdInput" placeholder="Введите Device ID" style="width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 8px; box-sizing: border-box; margin-bottom: 12px; font-size: 16px;">
      <div id="paymentError" class="error-msg" style="display: none; margin-bottom: 12px;"></div>

      <!-- Карточка тарифа -->
      <div class="tariff-card">
        <div class="tariff-header">
          <span class="tariff-title">Тариф PRO (Бессрочный доступ)</span>
          <span class="tariff-badge">PRO</span>
        </div>
        <div class="tariff-price" id="tariffPriceDisplay">1 ⭐ / 400 ₽</div>
      </div>

      <!-- Блок выбора способа оплаты -->
      <div class="payment-methods">
        <div class="payment-title">Выберите способ оплаты:</div>

        <label class="payment-option">
          <input type="radio" name="payment_method" value="stars" checked>
          <span class="payment-option-content">
            <span class="payment-method-name">Telegram Stars (1 ⭐ — Тестовая оплата)</span>
            <span class="payment-method-desc">Мгновенная оплата звездами внутри Telegram</span>
          </span>
        </label>

        <label class="payment-option">
          <input type="radio" name="payment_method" value="sbp">
          <span class="payment-option-content">
            <span class="payment-method-name">СБП / Карта РФ (400 ₽)</span>
            <span class="payment-method-desc">Перевод по номеру телефона через СБП</span>
          </span>
        </label>

        <div class="sbp-notice" id="paymentNotice">
          <div class="notice-icon">⭐</div>
          <div class="notice-text" id="paymentNoticeText">
            Счет на 1 Star будет выставлен официальным ботом. После оплаты бот автоматически пришлет ваш лицензионный ключ PRO!
          </div>
        </div>
      </div>

      <button type="button" id="payBtn" style="width: 100%; min-height: 48px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; border: none; background-color: var(--button-color); color: var(--button-text-color);">Оплатить через Telegram Stars (1 ⭐)</button>
    </div>

    <!-- Информационный блок статуса -->
    <div id="resultBlock" style="margin-top: 16px; display: none;"></div>
  </div>

  <script>
    const BOT_USERNAME = 'KladActivation_bot';

    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Элементы DOM
    const stepPayment = document.getElementById('stepPayment');
    const deviceIdInput = document.getElementById('deviceIdInput');
    const paymentError = document.getElementById('paymentError');
    const payBtn = document.getElementById('payBtn');
    const resultBlock = document.getElementById('resultBlock');
    const paymentNotice = document.getElementById('paymentNotice');
    const paymentNoticeText = document.getElementById('paymentNoticeText');
    const paymentMethodRadios = document.querySelectorAll('input[name="payment_method"]');

    // Автоподстановка Device ID из параметров запуска
    const urlParams = new URLSearchParams(window.location.search);
    const startParam = urlParams.get('startapp') || urlParams.get('tgWebAppStartParam') || tg?.initDataUnsafe?.start_param;
    if (startParam && deviceIdInput) {
      deviceIdInput.value = startParam.trim();
    }

    // Переключение способа оплаты
    paymentMethodRadios.forEach(radio => {
      radio.addEventListener('change', (e) => {
        if (e.target.value === 'stars') {
          paymentNotice.querySelector('.notice-icon').textContent = '⭐';
          paymentNoticeText.textContent = 'Счет на 1 Star будет выставлен официальным ботом. После оплаты бот автоматически сгенерирует и пришлет ваш PRO-ключ!';
          payBtn.textContent = 'Оплатить через Telegram Stars (1 ⭐)';
        } else {
          paymentNotice.querySelector('.notice-icon').textContent = '💡';
          paymentNoticeText.textContent = 'Перевод по СБП (400 ₽). В комментарии к платежу укажите ваш Device ID. После оплаты пришлите чек в бот для выдачи ключа.';
          payBtn.textContent = 'Инструкция по оплате СБП';
        }
      });
    });

    // Обработка кнопки оплаты
    payBtn.addEventListener('click', () => {
      const deviceId = (deviceIdInput.value || '').trim();

      if (!deviceId) {
        if (paymentError) {
          paymentError.style.background = 'rgba(255, 82, 82, 0.1)';
          paymentError.style.borderColor = 'rgba(255, 82, 82, 0.3)';
          paymentError.style.color = '#ff5252';
          paymentError.textContent = 'Пожалуйста, укажите ваш Device ID из приложения';
          paymentError.style.display = 'block';
        }
        deviceIdInput.style.borderColor = '#ff5252';
        deviceIdInput.focus();
        return;
      }

      if (paymentError) {
        paymentError.style.display = 'none';
      }
      deviceIdInput.style.borderColor = 'rgba(255, 255, 255, 0.15)';

      const selectedMethod = document.querySelector('input[name="payment_method"]:checked')?.value || 'stars';

      if (selectedMethod === 'stars') {
        const botUrl = `https://t.me/${BOT_USERNAME}?start=${encodeURIComponent(deviceId)}`;
        
        if (paymentError) {
          paymentError.style.background = 'rgba(76, 175, 80, 0.15)';
          paymentError.style.borderColor = 'rgba(76, 175, 80, 0.4)';
          paymentError.style.color = '#81c784';
          paymentError.textContent = 'Перенаправляем в бот для оплаты счета на 1 ⭐...';
          paymentError.style.display = 'block';
        }

        setTimeout(() => {
          if (tg && typeof tg.sendData === 'function') {
            try {
              tg.sendData(JSON.stringify({ deviceId }));
              return;
            } catch (e) {
              console.warn('sendData fallback to link:', e);
            }
          }
          if (tg && typeof tg.openTelegramLink === 'function') {
            tg.openTelegramLink(botUrl);
            setTimeout(() => {
              try { if (typeof tg.close === 'function') tg.close(); } catch (e) {}
            }, 500);
          } else {
            window.location.href = botUrl;
          }
        }, 300);
      } else {
        // СБП инструкции
        stepPayment.style.display = 'none';
        resultBlock.style.display = 'block';
        resultBlock.innerHTML = `
          <div class="key-card">
            <div style="font-size: 16px; font-weight: 700; color: #ffb74d;">Оплата через СБП (400 ₽)</div>
            <div style="font-size: 13px; color: var(--text-color); line-height: 1.5; text-align: left;">
              1. Переведите 400 ₽ по номеру телефона (СБП).<br>
              2. В назначении перевода укажите: <b>${deviceId}</b>.<br>
              3. Отправьте подтверждение в бот для выдачи ключа.
            </div>
            <button type="button" class="copy-btn" id="openBotForSbpBtn">Открыть чат с ботом</button>
            <button type="button" class="back-btn" id="backToPayBtn">Назад к способам оплаты</button>
          </div>
        `;

        document.getElementById('openBotForSbpBtn')?.addEventListener('click', () => {
          const botUrl = `https://t.me/${BOT_USERNAME}`;
          if (tg && typeof tg.openTelegramLink === 'function') {
            tg.openTelegramLink(botUrl);
          } else {
            window.location.href = botUrl;
          }
        });

        document.getElementById('backToPayBtn')?.addEventListener('click', () => {
          resultBlock.style.display = 'none';
          stepPayment.style.display = 'block';
        });
      }
    });

    // Сброс ошибки при вводе
    deviceIdInput.addEventListener('input', () => {
      if (paymentError && paymentError.style.display !== 'none') {
        paymentError.style.display = 'none';
        deviceIdInput.style.borderColor = 'rgba(255, 255, 255, 0.15)';
      }
    });
  </script>
</body>
</html>
