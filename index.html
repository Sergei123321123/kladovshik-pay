<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Активация Кладовщик PRO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #1a1a1a);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --button-color: var(--tg-theme-button-color, #2481cc);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg-color: var(--tg-theme-secondary-bg-color, #242424);
      --hint-color: var(--tg-theme-hint-color, #9e9e9e);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background-color: var(--secondary-bg-color);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h2 {
      margin-bottom: 18px;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-color);
    }

    #deviceIdInput {
      width: 100%;
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 8px;
      box-sizing: border-box;
      margin-bottom: 12px;
      font-size: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-color: rgba(0, 0, 0, 0.2);
      color: var(--text-color);
      outline: none;
    }

    #deviceIdInput:focus {
      border-color: var(--button-color);
    }

    #generateKeyBtn {
      width: 100%;
      min-height: 48px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: var(--button-color);
      color: var(--button-text-color);
      transition: opacity 0.2s;
    }

    #generateKeyBtn:active {
      opacity: 0.85;
    }

    #resultBlock {
      margin-top: 16px;
      display: none;
    }

    .error-msg {
      color: #ff5252;
      font-size: 14px;
      padding: 10px;
      background: rgba(255, 82, 82, 0.1);
      border: 1px solid rgba(255, 82, 82, 0.3);
      border-radius: 8px;
    }

    .key-card {
      padding: 16px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .key-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #4caf50;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 14px;
      border-radius: 8px;
      width: 100%;
      text-align: center;
      box-sizing: border-box;
      user-select: all;
    }

    .key-hint {
      font-size: 13px;
      color: var(--hint-color);
    }

    .copy-btn {
      width: 100%;
      min-height: 44px;
      border-radius: 8px;
      border: 1px solid var(--button-color);
      background-color: transparent;
      color: var(--button-color);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover, .copy-btn:active {
      background-color: var(--button-color);
      color: var(--button-text-color);
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Активация Кладовщик PRO</h2>
    <input type="text" id="deviceIdInput" placeholder="Введите Device ID" style="width: 100%; min-height: 44px; padding: 8px; border-radius: 8px; box-sizing: border-box; margin-bottom: 12px; font-size: 16px;">
    <button type="button" id="generateKeyBtn" style="width: 100%; min-height: 48px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;">Получить лицензионный ключ</button>
    <div id="resultBlock" style="margin-top: 16px; display: none;"></div>
  </div>

  <script>
    // Константы алгоритма лицензирования
    const LICENSE_SALT = 'KLAD_SALT_2026';
    const LICENSE_BASE_EPOCH = 1735689600000; // 2025-01-01 UTC

    function computeLicenseHash(deviceId, timeHex) {
      const cleanId = (deviceId || '').trim().toUpperCase();
      const raw = `${cleanId}:${timeHex}:${LICENSE_SALT}`;
      let h = 0x811c9dc5;
      for (let i = 0; i < raw.length; i++) {
        h ^= raw.charCodeAt(i);
        h = Math.imul(h, 0x01000193);
      }
      return (h >>> 0).toString(16).toUpperCase().padStart(8, '0');
    }

    function generateLicenseKey(deviceId, timestamp = Date.now()) {
      const cleanId = (deviceId || '').trim().toUpperCase();
      if (!cleanId) return null;
      const hours = Math.floor((timestamp - LICENSE_BASE_EPOCH) / (3600 * 1000));
      const timeHex = (hours & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
      const hashHex = computeLicenseHash(cleanId, timeHex);
      return `PRO-${timeHex}-${hashHex.slice(0, 4)}-${hashHex.slice(4, 8)}`;
    }

    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Элементы DOM
    const deviceIdInput = document.getElementById('deviceIdInput');
    const generateKeyBtn = document.getElementById('generateKeyBtn');
    const resultBlock = document.getElementById('resultBlock');

    // Автоподстановка Device ID из параметров запуска
    const urlParams = new URLSearchParams(window.location.search);
    const startParam = urlParams.get('startapp') || urlParams.get('tgWebAppStartParam') || tg?.initDataUnsafe?.start_param;
    if (startParam && deviceIdInput) {
      deviceIdInput.value = startParam.trim();
    }

    // Обработка генерации ключа
    generateKeyBtn.addEventListener('click', () => {
      const deviceId = (deviceIdInput.value || '').trim();
      resultBlock.style.display = 'block';

      if (!deviceId) {
        resultBlock.innerHTML = `
          <div class="error-msg">Пожалуйста, укажите Device ID</div>
        `;
        return;
      }

      const key = generateLicenseKey(deviceId);
      resultBlock.innerHTML = `
        <div class="key-card">
          <div class="key-display" id="generatedKeyText">${key}</div>
          <div class="key-hint">Ключ действителен для активации 3 дня</div>
          <button type="button" class="copy-btn" id="copyKeyBtn">Скопировать ключ</button>
        </div>
      `;

      const copyBtn = document.getElementById('copyKeyBtn');
      copyBtn.addEventListener('click', async () => {
        let copied = false;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(key);
            copied = true;
          } catch (e) {
            console.warn('Clipboard writeText failed', e);
          }
        }
        if (!copied) {
          const tempInput = document.createElement('input');
          tempInput.value = key;
          document.body.appendChild(tempInput);
          tempInput.select();
          try {
            document.execCommand('copy');
            copied = true;
          } catch (e) {
            console.error('execCommand copy failed', e);
          }
          document.body.removeChild(tempInput);
        }
        copyBtn.textContent = 'Скопировано!';
        setTimeout(() => {
          if (copyBtn) copyBtn.textContent = 'Скопировать ключ';
        }, 2500);
      });
    });
  </script>
</body>
</html>
